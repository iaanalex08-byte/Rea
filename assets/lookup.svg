<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#f4f2ec"/><stop offset="1" stop-color="#d4d1ca"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2a28"/><stop offset="1" stop-color="#6d6a64"/>
    </linearGradient>
    <linearGradient id="c" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e1d1c"/><stop offset="1" stop-color="#7a7770"/>
    </linearGradient>
    <pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="10" height="10" fill="none"/>
      <rect x="2" y="2" width="6" height="5" fill="#e6e2d9" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="400" height="560" fill="url(#sky)"/>
  <!-- four towers converging toward centre -->
  <g>
    <polygon points="0,0 170,0 175,190 120,240 0,250" fill="url(#a)"/>
    <polygon points="0,0 170,0 175,190 120,240 0,250" fill="url(#g)" transform="skewY(4)"/>
    <polygon points="400,0 240,0 230,200 270,250 400,270" fill="url(#a)"/>
    <polygon points="400,0 240,0 230,200 270,250 400,270" fill="url(#g)" transform="skewY(-4)"/>
    <polygon points="0,560 0,330 110,310 160,340 175,560" fill="url(#c)"/>
    <polygon points="0,560 0,330 110,310 160,340 175,560" fill="url(#g)"/>
    <polygon points="400,560 400,300 290,290 225,330 205,560" fill="url(#c)"/>
    <polygon points="400,560 400,300 290,290 225,330 205,560" fill="url(#g)"/>
  </g>
  <g stroke="#f1ede5" stroke-opacity=".25" stroke-width="1.2" fill="none">
    <path d="M175 190 L120 240"/><path d="M230 200 L270 250"/>
    <path d="M110 310 L160 340"/><path d="M290 290 L225 330"/>
  </g>
</svg>
