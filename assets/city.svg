<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e6e1"/>
      <stop offset=".55" stop-color="#cfccc5"/>
      <stop offset="1" stop-color="#a9a69f"/>
    </linearGradient>
    <linearGradient id="b" x1="0" x2="1">
      <stop offset="0" stop-color="#77746e"/><stop offset=".5" stop-color="#4b4945"/><stop offset="1" stop-color="#222120"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" x2="1">
      <stop offset="0" stop-color="#5b5955"/><stop offset="1" stop-color="#1b1a19"/>
    </linearGradient>
    <pattern id="win" width="5" height="7" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="2.4" height="4" fill="#d9d5cc" opacity=".22"/>
    </pattern>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e6e1" stop-opacity="0"/><stop offset="1" stop-color="#e8e6e1" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <!-- distant shore -->
  <path d="M0 250 L40 246 L52 238 L60 246 L120 244 L130 236 L140 244 L400 240 L400 262 L0 262Z" fill="#8f8c86" opacity=".7"/>
  <rect y="258" width="400" height="20" fill="#bdbab3"/>
  <!-- far skyline -->
  <g fill="#7b7872" opacity=".85">
    <rect x="0" y="262" width="400" height="80"/>
    <rect x="10" y="240" width="18" height="40"/><rect x="34" y="250" width="14" height="30"/>
    <rect x="250" y="236" width="16" height="50"/><rect x="280" y="246" width="22" height="40"/>
    <rect x="330" y="232" width="14" height="60"/><rect x="360" y="244" width="24" height="44"/>
  </g>
  <rect y="250" width="400" height="120" fill="url(#fog)"/>
  <!-- main tower -->
  <g fill="url(#b)">
    <rect x="199" y="40" width="1.4" height="40"/>
    <rect x="196.5" y="78" width="6" height="36"/>
    <path d="M190 132 Q199.5 100 209 132Z"/>
    <rect x="187" y="130" width="25" height="20"/>
    <rect x="180" y="148" width="39" height="22"/>
    <rect x="171" y="168" width="57" height="30"/>
    <rect x="160" y="196" width="79" height="420"/>
  </g>
  <rect x="160" y="168" width="79" height="440" fill="url(#win)"/>
  <!-- foreground blocks -->
  <g fill="url(#b2)">
    <rect x="0" y="330" width="60" height="280"/>
    <rect x="58" y="300" width="44" height="310"/>
    <rect x="100" y="360" width="50" height="250"/>
    <rect x="248" y="340" width="40" height="270"/>
    <rect x="286" y="290" width="54" height="320"/>
    <rect x="338" y="380" width="62" height="230"/>
    <rect x="20" y="430" width="70" height="180"/>
    <rect x="300" y="450" width="80" height="160"/>
  </g>
  <g fill="url(#win)">
    <rect x="0" y="330" width="150" height="280"/>
    <rect x="248" y="290" width="152" height="320"/>
  </g>
  <rect x="300" y="450" width="40" height="160" fill="#d9d5cc" opacity=".35"/>
  <rect x="306" y="456" width="28" height="150" fill="url(#win)"/>
</svg>
